[project]
name = "streetsense"
version = "0.1.0"
description = "Forecast where and when road conditions will challenge ADAS perception systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "StreetSense" }]

dependencies = [
    # API + persistence
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
    # HTTP/2 enabled for Mapillary (ADR 0005) and any future high-fan-out
    # imagery providers.
    "httpx[http2]>=0.27",
    # Geo
    "shapely>=2.0",
    "pyproj>=3.7",
    "osmium>=4.0",
    # Solar geometry (Phase 2 environmental scorer). See ADR 0003.
    "pvlib>=0.11",
    # Perception scorer (Phase 3). See ADR 0004.
    "onnxruntime>=1.19",
    "pillow>=10.4",
    # Object store (MinIO). Used by ingestion/imagery and api for
    # pre-signed URL assembly.
    "minio>=7.2",
    # Logging / config
    "structlog>=24.4",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # Hashing for stub risk
    "xxhash>=3.5",
]

[dependency-groups]
dev = [
    # Lint / format / types
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    # Test
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "vcrpy>=6.0",
]
# Heavy ML deps used only by tools/perception/build_real_onnx.py to convert
# a pretrained semantic-segmentation model to ONNX once during track setup.
# Not installed in CI or in the API/scoring runtime images. See ADR 0004.
model-export = [
    "torch>=2.5",
    "transformers>=4.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingestion", "scoring"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "frontend",
    "scoring/propagator/build",
    "node_modules",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
    "PT",     # flake8-pytest-style
    "ASYNC",  # async correctness
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # allow `assert False` in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy --strict scoped to api/ scoring/ ingestion/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "scoring", "ingestion"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "osmium.*",
    "shapely.*",
    "pyproj.*",
    "vcr.*",
    "xxhash.*",
    "pvlib.*",
    "pandas.*",
    "onnxruntime.*",
    "PIL.*",
    "minio.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "api", "scoring", "ingestion"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=api",
    "--cov=ingestion",
    "--cov=scoring",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require a running Postgres (deselect with '-m \"not integration\"')",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["api", "ingestion", "scoring"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
