# StreetSense CI.
#
# Runner choice: GitHub Actions. Picked because the repo is hosted (or will
# be) on GitHub and Actions has first-class service-container support for
# the Postgres+PostGIS integration job.
#
# Jobs:
#   python    -- ruff check + ruff format check + mypy --strict + pytest
#   frontend  -- eslint + prettier --check + tsc --noEmit + vitest
#   db        -- boots Postgres+PostGIS, applies migrations, runs schema-
#                invariant tests from tests/db/ (Phase 1.2.4).
#
# Performance budgets (sub-100ms pan/zoom, p99 tile latency) are checked by
# the separate benchmark workflows added in Phase 1.5 and Phase 1.6.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy --strict
        run: uv run mypy
      - name: Pytest (non-integration)
        run: uv run pytest -m "not integration"

  frontend:
    name: Frontend (eslint + prettier + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: OpenAPI typegen drift
        run: pnpm typegen:check
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test

  propagator-cpp:
    name: Propagator C++ (cmake + ctest + clang-format + clang-tidy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoring/propagator
    steps:
      - uses: actions/checkout@v4
        with:
          # pybind11 is vendored as a submodule (Phase 4.1.6). The bindings
          # build picks it up from external/pybind11/share/cmake/pybind11.
          submodules: recursive
      - name: Install C++ toolchain + Boost
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libboost-graph-dev libboost-dev \
            clang clang-format clang-tidy
      - name: Configure (default preset, Release)
        # Override generator to Ninja on Linux for ~5x faster configure than Make.
        # The preset's "auto" generator picks Make by default.
        run: cmake --preset default -G Ninja
      - name: Build (default preset)
        run: cmake --build --preset default
      - name: Test (default preset)
        # Phase 4.1: 0 tests expected. testPreset's noTestsAction=ignore turns
        # ctest's "no tests found" non-zero into a clean exit. Phase 4.2+ adds
        # real tests; this step becomes load-bearing then.
        run: ctest --preset default --output-on-failure
      - name: Configure (debug preset, ASan + UBSan)
        run: cmake --preset debug -G Ninja
      - name: Build (debug preset)
        run: cmake --build --preset debug
      - name: Test (debug preset)
        # AddressSanitizer + UndefinedBehaviorSanitizer execution. Phase 4.1
        # has no tests; Phase 4.2+ asserts zero leaks / zero UB.
        run: ctest --preset debug --output-on-failure
      - name: clang-format --dry-run --Werror
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            'scoring/propagator/include/**/*.h' \
            'scoring/propagator/src/**/*.cc' \
            'scoring/propagator/src/**/*.h' \
            'scoring/propagator/bindings/**/*.cc' \
            'scoring/propagator/bindings/**/*.h' \
            'scoring/propagator/tests/**/*.cc' \
            'scoring/propagator/tests/**/*.h' \
            'scoring/propagator/bench/**/*.cc' \
            'scoring/propagator/bench/**/*.h')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no C++ files yet (Phase 4.1 scaffold); skipping clang-format"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
      - name: clang-tidy --warnings-as-errors='*'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            'scoring/propagator/src/**/*.cc' \
            'scoring/propagator/bindings/**/*.cc' \
            'scoring/propagator/tests/**/*.cc' \
            'scoring/propagator/bench/**/*.cc')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no C++ files yet (Phase 4.1 scaffold); skipping clang-tidy"
            exit 0
          fi
          # -p points clang-tidy at the compile_commands.json from the default
          # build (CMAKE_EXPORT_COMPILE_COMMANDS=ON is set in the preset).
          clang-tidy --warnings-as-errors='*' \
            -p scoring/propagator/build/default \
            "${files[@]}"

  db:
    name: Postgres integration (schema invariants)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: streetsense
          POSTGRES_USER: streetsense
          POSTGRES_PASSWORD: streetsense
        ports:
          - 5432:5432
        # Wait until *postgis* itself is queryable, not just the socket.
        options: >-
          --health-cmd "pg_isready -U streetsense -d streetsense && psql -U streetsense -d streetsense -tAc \"SELECT 1 FROM pg_extension WHERE extname='postgis'\" | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      DATABASE_URL: postgresql+psycopg://streetsense:streetsense@localhost:5432/streetsense
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: streetsense
      POSTGRES_USER: streetsense
      POSTGRES_PASSWORD: streetsense
      POSTGRES_APP_USER: streetsense_app
      POSTGRES_APP_PASSWORD: streetsense_app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ensure pgcrypto extension is present
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        env:
          DATABASE_URL: postgresql://streetsense:streetsense@localhost:5432/streetsense
      - name: Apply Alembic migrations
        run: uv run alembic upgrade head
      - name: Schema invariant tests
        run: uv run pytest tests/db -v -m "integration or not integration"
