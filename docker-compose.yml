# StreetSense local data plane.
#
# Phase 1: Postgres 16 + PostGIS 3.4.
# Phase 3: MinIO (S3-compatible object store) for imagery bytes and the
#          cached perception-model ONNX artifact. Two buckets are seeded
#          on first boot by a one-shot init container.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: streetsense-postgres
    environment:
      POSTGRES_DB: streetsense
      POSTGRES_USER: streetsense
      POSTGRES_PASSWORD: streetsense
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Wait until PostGIS is actually available, not just the postgres socket.
      test:
        - "CMD-SHELL"
        - "pg_isready -U streetsense -d streetsense && psql -U streetsense -d streetsense -tAc \"SELECT 1 FROM pg_extension WHERE extname='postgis'\" | grep -q 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # S3-compatible object store. Phase 3 stores Mapillary imagery bytes
  # under `streetsense-imagery/` and the perception-model ONNX artifact
  # under `streetsense-models/`. Pinned to a SHA so local + future-CI
  # behavior stays deterministic. AWS S3 replaces MinIO in Phase 5.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: streetsense-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streetsense}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streetsense}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket seeder. Idempotent: `mb --ignore-existing` returns
  # success when buckets already exist, so re-running `docker compose up`
  # does not surprise the user.
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: streetsense-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streetsense}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streetsense}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/streetsense-imagery &&
      mc mb --ignore-existing local/streetsense-models &&
      echo 'streetsense-imagery and streetsense-models ready'
      "
    restart: "no"

  # Vector tile server (ADR 0002). Connects as the app role so it inherits
  # the same least-privilege grants as FastAPI (SELECT only on the
  # publishing view).
  tileserv:
    image: pramsey/pg_tileserv:latest
    container_name: streetsense-tileserv
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://streetsense_app:streetsense_app@postgres:5432/streetsense
      TS_BASEPATH: /tiles
      TS_HTTPPORT: "7800"
      TS_CORSORIGINS: "*"
    ports:
      - "7800:7800"
    restart: unless-stopped

volumes:
  pgdata:
    name: streetsense-pgdata
  miniodata:
    name: streetsense-miniodata
